<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subsyncarr+</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="sidebar-brand">
      <h1>🧬 Subsyncarr+</h1>
      <div class="version"><span id="versionText">-</span> · <a id="releaseLink" href="#" target="_blank">GitHub</a></div>
    </div>
    <button class="nav-item active" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</button>
    <button class="nav-item" data-page="run"><span class="nav-icon">▶</span> Current Run</button>
    <button class="nav-item" data-page="history"><span class="nav-icon">📜</span> History</button>
    <button class="nav-item" data-page="folders"><span class="nav-icon">📁</span> Folders</button>
    <div class="sidebar-footer">
      <span id="sidebarStatus">● Idle</span>
      <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
    </div>
  </nav>

  <main class="main">
    <div class="page active" id="page-dashboard">
      <div class="topbar">
        <h2>Dashboard</h2>
        <div class="status-row">
          <div class="status-dot" id="dashStatusDot"></div>
          <span id="dashStatusText">Loading...</span>
          <span class="schedule-badge" id="dashSchedule">...</span>
        </div>
      </div>
      <div id="scanBanner" class="scan-banner hidden">
        <div class="scan-title">🔍 Scanning files...</div>
        <div class="progress-bar"><div class="progress-fill" id="scanProgressFill" style="width:0%"></div></div>
        <div class="scan-stats">
          <span id="scanChecked">0 checked</span>
          <span id="scanNeedSync">0 need sync</span>
          <span id="scanAlready">0 synced</span>
        </div>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
      <div class="engine-cards" id="engineCards"></div>
      <div class="controls">
        <button class="btn btn-primary" id="startRun">▶ Start Full Run</button>
        <button class="btn btn-secondary" id="startCustom">📁 Scan Specific Path</button>
        <button class="btn btn-danger hidden" id="stopRun">⏹ Stop</button>
      </div>
      <h3 style="margin-bottom:12px">🌐 Language Distribution</h3>
      <div class="lang-grid" id="langGrid"></div>
    </div>

    <div class="page" id="page-run">
      <div class="topbar">
        <h2>Current Run</h2>
        <span class="status-badge running" id="runStatusBadge">IDLE</span>
      </div>
      <div id="runContent" class="text-muted text-sm">No run in progress.</div>
    </div>

    <div class="page" id="page-history">
      <div class="topbar"><h2>Run History</h2></div>
      <table id="historyTable"><thead><tr>
        <th>Start</th><th>Status</th><th>Files</th><th>✓</th><th>⊘</th><th>✗</th><th>⚠</th><th>F</th><th>Au</th><th>Al</th><th>Time</th><th></th>
      </tr></thead><tbody id="historyBody"></tbody></table>
    </div>

    <div class="page" id="page-folders">
      <div class="topbar"><h2>Media Folders</h2></div>
      <div class="folder-list" id="folderList"></div>
    </div>
  </main>
</div>

<div id="customPathModal" class="modal hidden">
  <div class="modal-content"><div class="modal-header"><h3>Scan Specific Paths</h3><button class="btn-close" id="closeModal">&times;</button></div>
    <textarea id="customPaths" placeholder="/path/to/dir1&#10;/path/to/dir2"></textarea>
    <div class="modal-actions"><button class="btn btn-secondary" id="cancelCustom">Cancel</button><button class="btn btn-primary" id="submitCustom">Start Scan</button></div>
  </div>
</div>

<div id="logsModal" class="modal hidden">
  <div class="modal-content logs-modal"><div class="modal-header"><h3>Run Logs</h3><button class="btn-close" id="closeLogsModal">&times;</button></div>
    <pre class="logs-content" id="logsContent"></pre>
    <div class="modal-actions"><button class="btn btn-secondary" id="copyLogs">📋 Copy</button><button class="btn btn-primary" id="closeLogsButton">Close</button></div>
  </div>
</div>

<div id="fileListModal" class="modal hidden">
  <div class="modal-content"><div class="modal-header"><h3 id="fileListTitle">Files</h3><button class="btn-close" id="closeFileListModal">&times;</button></div>
    <div id="fileListContent" class="logs-content"></div>
    <div class="modal-actions"><button class="btn btn-primary" id="closeFileListButton">Close</button></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
