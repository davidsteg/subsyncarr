name: Build and Publish Docker Image

# Publishes a GitHub Release with the notes from the matching ## [<version>]
# section of CHANGELOG.md and, alongside it, builds and pushes the image to
# Docker Hub. The release doesn't wait for the image build.
#
# Normally called by release.yml, which creates the version tag after CI
# passes on master. A version tag pushed by hand (no "v" prefix, e.g. 2.1.0)
# still triggers it directly.
#
# :latest only moves when the version being built is the highest X.Y.Z tag,
# so rebuilding an old tag never takes :latest away from the newest release.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      version:
        description: Version tag to build and release (X.Y.Z)
        required: true
        type: string

permissions:
  contents: write # needed to create the GitHub Release below

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Is this the newest release?
        id: latest
        run: |
          NEWEST=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$NEWEST" = "$VERSION" ]; then IS_LATEST=true; else IS_LATEST=false; fi
          echo "Newest tag: $NEWEST, building: $VERSION, latest: $IS_LATEST"
          echo "latest=$IS_LATEST" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this version
        run: |
          awk -v target="## [$VERSION]" '
            index($0, "## [") == 1 {
              if (found) exit
              if (index($0, target) == 1) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          echo "--- extracted release notes ---"
          cat release_notes.md

      - name: Build release title
        id: title
        run: |
          # A short plain line right under the version heading in CHANGELOG.md
          # is the title. Otherwise use the commit that set this version in
          # VERSION, minus any "feat:"-style prefix, version prefix or
          # "(X.Y.Z)" suffix.
          SUMMARY=$(awk 'NF { print; exit }' release_notes.md)
          if [ -n "$SUMMARY" ] && [ "${#SUMMARY}" -le 100 ] && [[ ! "$SUMMARY" =~ ^(#|-|\*|[0-9]+\.) ]]; then
            CLEAN="$SUMMARY"
          else
            SUBJECT=$(git log -1 --format=%s -- VERSION)
            [ -n "$SUBJECT" ] || SUBJECT=$(git log -1 --format=%s)
            CLEAN=$(echo "$SUBJECT" | sed -E \
              -e 's/^[a-zA-Z]+(\([^)]*\))?: //' \
              -e "s/^v?${VERSION//./\\.}:? *(— *)?//" \
              -e "s/ *\(v?${VERSION//./\\.}\)$//")
          fi
          CLEAN="$(echo "${CLEAN:0:1}" | tr '[:lower:]' '[:upper:]')${CLEAN:1}"
          echo "title=$VERSION — $CLEAN" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping creation"
          else
            gh release create "$VERSION" \
              --verify-tag \
              --title "${{ steps.title.outputs.title }}" \
              --notes-file release_notes.md \
              --latest=${{ steps.latest.outputs.latest }}
          fi

  docker:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version || github.ref_name }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: davidsteg/subsyncarr
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ needs.release.outputs.latest }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # amd64 only — no QEMU emulation needed. Re-add linux/arm64 (and the
          # Set up QEMU step) if this ever needs to run on ARM hardware.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
